name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}

        run: |
          mkdir -p ~/.ssh

          echo "$VM_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "$VM_USERNAME@$VM_HOST" << 'EOF'
            cd /home/vbox/project_code/http-server

            git pull origin main

            cd build

            cmake ..

            make

            ./server
          EOF